name: WAGNER Software Factory CI

on:
  push:
    branches: ["master", "**"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  backend-test-suite:
    name: Rust Backend Test Suite & Static Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend -> target"

      - name: Check compilation (cargo check)
        run: cargo check --all-targets

      - name: Run WAGNER Backend Unit & Integration Test Suite
        run: cargo test --all-targets -- --nocapture

  frontend-build-check:
    name: Vue 3 UI Build Smoke Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build WAGNER UI
        run: |
          npm ci
          npm run build
