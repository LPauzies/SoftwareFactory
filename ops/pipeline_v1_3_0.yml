# WAGNER Software Factory — CI/CD & Rollback Pipeline (v1.3.0)
stages: [scm_guard, build, test_factory, deploy_prod, rollback_ready]

deploy_production:
stage: deploy_prod
script:
- ./ops/deploy.sh --version v1.3.0

rollback_on_alert:
stage: rollback_ready
when: on_failure
script:
- ./ops/rollback_v1_3_0.sh
